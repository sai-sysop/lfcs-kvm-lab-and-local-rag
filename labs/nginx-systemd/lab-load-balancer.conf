upstream lab_backends {
    server 127.0.0.1:9001 weight=3 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:9002 weight=1 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:9003 backup;
}

server {
    listen 8091;
    add_header X-Upstream-Addr $upstream_addr always;

    # Default route: Weighted load balancing across 9001 (3x) and 9002 (1x)
    location / {
        proxy_pass http://lab_backends;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Direct path route to Backend 1 only (trailing slash strips /app1/)
    location /app1/ {
        proxy_pass http://127.0.0.1:9001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Direct path route to Backend 2 only (trailing slash strips /app2/)
    location /app2/ {
        proxy_pass http://127.0.0.1:9002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
